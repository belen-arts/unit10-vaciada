<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaciada — map to cloth</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">

    <!-- top bar -->
    <div id="topbar">
      <span class="wordmark">VACIADA /</span>
      <div id="search-wrap">
        <input id="place-input" type="text" placeholder="search a place — granadilla, españa…" />
        <button id="search-btn">search</button>
      </div>
    </div>

    <!-- toolbar -->
    <div id="toolbar">
      <button class="tool-btn active" id="btn-pan">pan</button>
      <button class="tool-btn" id="btn-zone">draw zone</button>
      <button class="tool-btn" id="btn-draw">draw lines</button>
      <button class="tool-btn" id="btn-clear-zone">clear zone</button>
      <button class="tool-btn" id="btn-export">export .fold</button>
      <div id="status">no zone set</div>
    </div>

    <!-- split: map | fold preview -->
    <div id="split-row">

      <!-- LEFT: map + sidebar -->
      <div id="left-panel">
        <div id="map-wrap">
          <div id="map"></div>
          <canvas id="canvas"></canvas>
        </div>
        <div id="sidebar">
          <div id="sidebar-header">fold lines</div>
          <div id="lines-list">
            <p class="empty-msg">draw a zone,<br>then add fold<br>lines inside it.</p>
          </div>
          <div id="sidebar-footer">
            <p id="sidebar-hint">M = mountain · V = valley</p>
            <button id="clear-btn">clear all lines</button>
          </div>
        </div>
      </div>

      <!-- RIGHT: fold simulation -->
      <div id="right-panel">
        <div id="fold-header">
          <span class="panel-label">FOLD SIMULATION</span>
          <div id="slider-wrap">
            <span class="slider-label">0%</span>
            <input type="range" id="fold-slider" min="0" max="100" value="0" />
            <span class="slider-label">100%</span>
          </div>
        </div>
        <div id="fold-canvas-wrap">
          <canvas id="fold-canvas"></canvas>
          <div id="fold-empty">
            <p>draw a zone and<br>fold lines to see<br>the simulation</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
  <script type="module" src="main.js"></script>

</body>
</html>
